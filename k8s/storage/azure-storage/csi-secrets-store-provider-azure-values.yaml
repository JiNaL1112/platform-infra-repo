# ================================================================
# csi-secrets-store-provider-azure Helm values
# Chart: csi-secrets-store-provider-azure/csi-secrets-store-provider-azure
# This chart bundles BOTH the core secrets-store-csi-driver and the
# Azure Key Vault provider as a single install.
#
# Install:
#   helm repo add csi-secrets-store-provider-azure https://azure.github.io/secrets-store-csi-driver-provider-azure/charts
#   helm install csi-secrets-store-provider-azure csi-secrets-store-provider-azure/csi-secrets-store-provider-azure \
#     --namespace kube-system \
#     --values csi-secrets-store-provider-azure-values.yaml
#
# Upgrade:
#   helm upgrade csi-secrets-store-provider-azure csi-secrets-store-provider-azure/csi-secrets-store-provider-azure \
#     --namespace kube-system \
#     --values csi-secrets-store-provider-azure-values.yaml
#
# IMPORTANT: after any change to this file, verify what actually landed:
#   helm get values csi-secrets-store-provider-azure -n kube-system -o yaml
# ================================================================

# --------------------------------------------
# Auth mode used in this project: Service Principal via nodePublishSecretRef
# (secrets-store-creds secret), NOT Workload Identity — this cluster is
# bare kubeadm, not AKS, so there's no OIDC issuer trust with Azure AD
# for federated credentials to work.
#
# CRITICAL: do not set "clientID" anywhere in a SecretProviderClass's
# parameters when using SP mode. Its presence forces the provider into
# Workload Identity auth regardless of usePodIdentity/useVMManagedIdentity
# settings, and that auth will fail with AADSTS70025 on this cluster.
# This cost significant debugging time — see incident notes.
# --------------------------------------------

# Bundled secrets-store-csi-driver subchart. Values are scoped
# under the subchart's name so Helm routes them correctly.
secrets-store-csi-driver:

  # Required for `secretObjects:` on SecretProviderClasses to actually
  # produce a real K8s Secret object (bankapp-secret, mysql-secret).
  # Without this, the CSI mount succeeds and files land under
  # /mnt/secrets-store, but no Secret is created and env-var-based
  # consumption (secretKeyRef) breaks with "secret not found".
  syncSecret:
    enabled: true

  # Reconcile loop that re-fetches KV values and updates the synced
  # Secret + mounted files on a timer. 2m is the upstream default.
  enableSecretRotation: true
  rotationPollInterval: 2m

  # Left at chart default. This audience is used for the driver's
  # Workload Identity token-request flow. We do NOT rely on this flow
  # (see auth mode note above) — SP mode via nodePublishSecretRef works
  # independently of this setting. Disabling this was tried mid-session
  # as a troubleshooting step and did NOT fix the actual root cause
  # (which was the stray `clientID` parameter) — left here at default
  # rather than disabled, since removing it broke an unrelated fallback
  # path without resolving anything.
  tokenRequests:
    - audience: api://AzureADTokenExchange

# --------------------------------------------
# Provider-level settings (top-level, not under the driver subchart)
# --------------------------------------------

# This project only runs Linux nodes.
linux:
  enabled: true

windows:
  enabled: false